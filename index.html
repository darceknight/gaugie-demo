<html lang="en"><head>

<title>Gaugie Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'><rect width='32' height='32' fill='%23050a10'/><rect x='5' y='11' width='22' height='12' fill='%231fb5a8'/><rect x='8' y='7' width='16' height='5' fill='%231fb5a8'/><rect x='9' y='8' width='14' height='5' fill='%230a3d48'/><rect x='11' y='9' width='3' height='3' fill='%2300e5ff'/><rect x='18' y='9' width='3' height='3' fill='%2300e5ff'/><rect x='6' y='15' width='3' height='2' fill='%23ffd23f'/><rect x='23' y='15' width='3' height='2' fill='%23ffd23f'/><rect x='7' y='22' width='5' height='4' fill='%2314161b'/><rect x='20' y='22' width='5' height='4' fill='%2314161b'/><rect x='12' y='19' width='8' height='1' fill='%2314161b'/></svg>">
<style>/* Gaugie palette (same as core kPalette) */
[hidden]{display:none!important}
:root{--vis:#050a10;--out:#14161b;--gun:#3a414a;--mid:#6b7480;--lgt:#b8c0c8;--cyn:#00e5ff;--dcy:#0a3d48;--org:#ff7a1a;--red:#ff3b30;
--grn:#7dff6a;--yel:#ffd23f;--mag:#ff3fb4;--nav:#0b1030;--pur:#6a2cff;--wht:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--vis);color:var(--lgt);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;
 background:repeating-linear-gradient(0deg,#0000 0 3px,#00e5ff06 3px 4px),var(--vis)}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:3px solid var(--out)}
main{flex:1;overflow-y:auto;padding:12px 12px 18px}
nav{display:grid;grid-template-columns:repeat(7,1fr);padding-left:10px;padding-right:10px;border-top:3px solid var(--out);background:#080d14;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button.on{background:var(--dcy)}
canvas.px{image-rendering:pixelated;display:block}
.chip{font-size:11px;padding:2px 7px;border:2px solid var(--gun);color:var(--mid);text-transform:uppercase}
.chip.ok{border-color:var(--grn);color:var(--grn)}.chip.demo{border-color:var(--org);color:var(--org)}
.card{background:var(--out);border:2px solid var(--gun);box-shadow:0 0 0 2px var(--vis),4px 4px 0 2px #000;padding:10px;margin:0 0 14px}
.mirror{display:flex;justify-content:center;padding:6px 0 2px}
.mirror canvas{width:232px;height:232px;border-radius:50%;box-shadow:0 0 0 6px #0d0f12,0 0 0 9px var(--gun),0 0 30px #00e5ff33}
.bars{display:grid;grid-template-columns:auto 1fr 34px;gap:5px 8px;align-items:center}
.bar{height:10px;background:var(--vis);border:2px solid var(--gun)}.bar i{display:block;height:100%}
.btn{background:var(--dcy);border:2px solid var(--cyn);color:var(--cyn);padding:8px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
 box-shadow:3px 3px 0 #000;font:inherit;text-transform:uppercase}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.org{background:#3a1d08;border-color:var(--org);color:var(--org)}.btn.red{background:#3a0d0b;border-color:var(--red);color:var(--red)}
.btn.ghost{background:none;border-color:var(--gun);color:var(--lgt)}.btn:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.care{flex-direction:column;padding:12px 4px;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mid);font-size:11px}
input[type=text],input[type=url],input[type=password],input[type=number],select{width:100%;background:var(--vis);border:2px solid var(--gun);color:var(--wht);padding:7px;font:inherit}
.row select{flex:1;width:auto}
label.f{display:block;margin:6px 0 2px;color:var(--mid);font-size:11px;text-transform:uppercase}
.tog{appearance:none;width:42px;height:22px;background:var(--vis);border:2px solid var(--gun);position:relative;cursor:pointer;flex:none}
.tog:after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--mid)}
.tog:checked{border-color:var(--grn)}.tog:checked:after{left:22px;background:var(--grn)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shop .card{margin:0;text-align:center}
.shop canvas[data-thumb]{width:100%;aspect-ratio:1;border-radius:50%}.shop [data-px] canvas{margin:0 auto}
.feed li{list-style:none;padding:7px 0;border-bottom:1px dashed var(--gun);display:flex;gap:8px}.feed ul{margin:0;padding:0}
.feed .t{color:var(--mid);font-size:11px;white-space:nowrap}
#banner{background:var(--red);color:#fff;padding:7px 12px;font-weight:bold;cursor:pointer}
#onb{position:fixed;inset:0;background:var(--vis);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}
#onb .box{max-width:380px;width:100%;text-align:center}#onb [data-px] canvas{margin:0 auto}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--out);border:2px solid var(--cyn);padding:8px 12px;z-index:10;box-shadow:3px 3px 0 #000}
.coin{color:var(--yel)}
.game{height:22px;background:var(--vis);border:2px solid var(--gun);position:relative;margin:8px 0}
.game .z{position:absolute;top:0;bottom:0;background:#1f6b2a}.game .n{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--org)}
.dev{display:flex;justify-content:center}
.dbody{position:relative;width:300px;height:352px;border-radius:50% 50% 46% 46% / 48% 48% 52% 52%;background:radial-gradient(circle at 30% 22%,#69737e,#3a414a 38%,#1d2126 75%);
 box-shadow:0 18px 36px #000c,inset 0 2px 0 #8a949f,inset 0 -8px 20px #0008;display:flex;flex-direction:column;align-items:center;padding-top:22px}
.dbody .brand{position:absolute;top:7px;font-size:9px;letter-spacing:.4em;color:#b8c0c8;opacity:.75}
.bezel{width:256px;height:256px;border-radius:50%;padding:8px;background:radial-gradient(circle at 35% 28%,#2a3038,#0a0c0f);box-shadow:inset 0 0 0 2px #59626c}
.bezel canvas{width:240px;height:240px;border-radius:50%;background:#000;touch-action:none;cursor:pointer}
.keys{position:absolute;bottom:14px;display:flex;gap:26px}
.keys div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8px;letter-spacing:.12em;color:#c8d0d8}
.keys button{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffb066,var(--org) 45%,#b34a00);box-shadow:0 4px 0 #6b2c00,0 6px 10px #0008}
.keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b2c00}
.odo .drums{display:flex;gap:3px;justify-content:center;margin:10px 0 6px}
.odo .drums i{font:700 26px ui-monospace,monospace;font-style:normal;background:linear-gradient(#000,#23252a 25%,#23252a 75%,#000);color:#fff;padding:4px 6px;border-radius:3px;box-shadow:inset 0 0 0 1px #3a414a}
.odo .drums i:last-child{background:linear-gradient(#b8c0c8,#fff 25%,#fff 75%,#b8c0c8);color:#ff3b30}
.odo .drums i.dot{background:none;box-shadow:none;padding:4px 0;color:#6b7480}
</style>
</head><body>

</div>

function wire(v) {

<script>// Gaugie Hub: the phone is the hub. It talks to the Gaugie over ONE BLE characteristic with small JSON (core/include/dashpet/hub.h),
// or to a virtual Gaugie (the same C++ core compiled to WebAssembly) in demo mode. Classic script so the single-file bundle works from file://.
(async () => {

// ---------- store (everything stays on this phone) ----------
const KEY = 'gaugie-hub-v1';
const DEF = { onboarded: false, mode: 'demo', coins: 15, owned: [0], fw: '', units: 'mi', notif: false, feed: [], friends: [], simSave: '',

  src: { car: { on: true }, loc: { on: false, home: null, r: 150 }, social: { on: false, url: '', key: '' },
         home: { on: false, ha: '', mqtt: '', topic: 'gaugie/event' }, shortcut: { on: true } } };
let S = Object.assign(structuredClone(DEF), JSON.parse(localStorage.getItem(KEY) || '{}'));
S.src = Object.assign(structuredClone(DEF.src), S.src);
const save = () => { if (!MOCK) localStorage.setItem(KEY, JSON.stringify(S)); };
const log = (kind, text) => { S.feed.unshift({ at: now(), kind, text }); S.feed.length = Math.min(S.feed.length, 200); save(); if (tab === 'feed') render(); };

// ---------- pixel font (same 3x5 glyphs as the device, generated from core/src/tama_draw.cpp) ----------
function px(text, color = C.cyn, sc = 2) {
  text = String(text).toUpperCase(); const cv = document.createElement('canvas'); cv.className = 'px';
  cv.width = Math.max(1, text.length * 4 - 1) * sc; cv.height = 5 * sc; const g = cv.getContext('2d'); g.fillStyle = color;
  [...text].forEach((ch, i) => { const b = GFONT[ch]; if (b) for (let k = 0; k < 15; k++) if (b[k] === '1') g.fillRect((i * 4 + k % 3) * sc, ((k / 3) | 0) * sc, sc, sc); });

}

// ---------- core instances (WASM build of core/src/tama*.cpp + hub.cpp) ----------
async function core() {

  const k = { M, nw: w('t_new', null, ['number', 'number']), save: w('t_save', 'string', []), load: w('t_load', 'number', ['string']),
    tick: w('t_tick', 'number', ['number']), draw: w('t_draw', 'number', ['number']), set: w('t_set', null, Array(12).fill('number')),
    ui: w('t_ui', null, Array(5).fill('number')), hub: w('t_hub', 'string', ['string', 'number', 'number']), hs: w('t_hubstate', 'string', ['number']),
    beacon: w('t_beacon', 'string', ['number']), meet: w('t_meet', 'number', ['string', 'number', 'number']), helpreq: w('t_helpreq', 'string', []),

}
class BleDevice {   // Web Bluetooth (Chrome/Edge on Android + desktop). iOS: Capacitor wrapper, see docs/gaugie-hub.md
  label = 'GAUGIE (BLE)'; q = Promise.resolve(); pending = null;
  async open() {
    this.d = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    this.d.addEventListener('gattserverdisconnected', () => { this.up = false; setLink(); toast('GAUGIE DISCONNECTED'); });
    const srv = await this.d.gatt.connect(); this.ch = await (await srv.getPrimaryService(SVC)).getCharacteristic(CHR);
    await this.ch.startNotifications();
    this.ch.addEventListener('characteristicvaluechanged', e => { let m; try { m = JSON.parse(new TextDecoder().decode(e.target.value)); } catch { return; }
      if (this.pending) { const p = this.pending; this.pending = null; p(m); } onMsg(m); });
    this.up = true; this.k = await core(); this.k.nw(now(), 1); this.label = this.d.name || this.label;
  }

    const b = new TextEncoder().encode(JSON.stringify(o));
    return this.q = this.q.then(() => new Promise(res => { this.pending = res; setTimeout(() => { if (this.pending === res) { this.pending = null; res(null); } }, 1500);
      this.ch.writeValueWithResponse(b).catch(e => { toast('BLE: ' + e.message); res(null); }); }));
  }
  mirrorCfg(c) { this.k.hub(JSON.stringify({ t: 'set', face: c.face }), now(), 0); this.k.hub(JSON.stringify({ t: 'odo', total: c.odo }), now(), 0); }   // trips not mirrored
  mirror(m) { this.k.set(m.f, m.h, m.c, m.hp, m.e, m.age, m.st, m.sick, m.zz, m.dead, m.mud, m.bg); }
  frame(ms, cv) { blit(this.k, this.k.draw(ms), cv); }

}
async function connect(mode) {

  l.textContent = ble ? (dev.up ? 'BLE LINKED' : 'OFFLINE') : 'DEMO'; };

  odoGpsW = navigator.geolocation.watchPosition(p => { const c = p.coords; if (c.accuracy > 50) return;
    if (odoLast) { const R = 3958.8, r = Math.PI / 180, dl = (c.latitude - odoLast.latitude) * r, dg = (c.longitude - odoLast.longitude) * r;
      const d = 2 * R * Math.asin(Math.sqrt(Math.sin(dl / 2) ** 2 + Math.cos(odoLast.latitude * r) * Math.cos(c.latitude * r) * Math.sin(dg / 2) ** 2));
      if (d > 0.006 && d < 2 && (c.speed == null || c.speed > 1.5)) odoPush(d); else if (d <= 0.006) return; }
    odoLast = c; }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
}
const onSpeed = kmh => { const t = performance.now(); if (obdT && kmh > 0) odoPush(kmh * 0.621371 * Math.min(5, (t - obdT) / 1000) / 3600); obdT = t; };
setInterval(() => { if (dev && dev.k && dev.k.hour) dev.k.hour(new Date().getHours()); }, 10000);
const lastScore = { v: null };
async function key(k) { beep(k === 1 ? 2200 : 1600); const before = st && JSON.stringify([st.f, st.h, st.c, st.hp, st.e, st.zz, st.bg]);
  const r = await dev.send({ t: 'key', k }); if (r && r.t === 'state' && before && JSON.stringify([r.f, r.h, r.c, r.hp, r.e, r.zz, r.bg]) !== before) { S.coins += 1; log('care', 'On-device care' + (r.msg ? ' — ' + r.msg : '')); } }
function touch(cv) {   // same gestures as the device: tap = OK, hold 600 ms = BACK, swipe left = next, swipe right = prev
  let x0, y0, t0 = 0, timer, held;
  cv.onpointerdown = e => { e.preventDefault(); x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); held = false; timer = setTimeout(() => { held = true; key(2); }, 600); };
  cv.onpointermove = e => { if (t0 && Math.hypot(e.clientX - x0, e.clientY - y0) > 14) clearTimeout(timer); };
  cv.onpointerup = e => { clearTimeout(timer); if (!t0) return; const dx = e.clientX - x0; t0 = 0; if (held) return; if (Math.abs(dx) > 40) key(dx < 0 ? 0 : 3); else key(1); };
  cv.onpointerleave = () => { clearTimeout(timer); t0 = 0; };
}
addEventListener('keydown', e => { if (tab !== 'pet' || e.target.tagName === 'INPUT') return; const m = { a: 0, s: 1, d: 2, ArrowRight: 0, Enter: 1, Escape: 2, ArrowLeft: 3 }[e.key]; if (m != null) { e.preventDefault(); key(m); } });
// phone geofence (only while the app is open; see docs for background limits)
let geoW = null; function geo() {
  if (geoW != null) { navigator.geolocation.clearWatch(geoW); geoW = null; }
  const L = S.src.loc; if (!L.on || !L.home || !navigator.geolocation) return; let inside = null;
  geoW = navigator.geolocation.watchPosition(p => {
    const R = 6371e3, r = Math.PI / 180, [a, b] = L.home, dl = (p.coords.latitude - a) * r, dg = (p.coords.longitude - b) * r;
    const d = 2 * R * Math.asin(Math.sqrt(Math.sin(dl / 2) ** 2 + Math.cos(a * r) * Math.cos(p.coords.latitude * r) * Math.sin(dg / 2) ** 2));
    const isIn = d < L.r; if (inside !== null && isIn !== inside) fire('loc', isIn ? 'arrive_home' : 'leave_home', 0, 'geofence'); inside = isIn;
  }, () => {}, { enableHighAccuracy: false, maximumAge: 60000 });
}

// ---------- onboarding ----------
function onboarding() {
  const o = $('#onb'); o.hidden = false; let step = 0;
  const show = () => {
    o.innerHTML = `<div class="box">${[
      `<canvas id="obm" width="116" height="116" class="px" style="width:200px;height:200px;border-radius:50%;margin:0 auto 18px;box-shadow:0 0 0 6px #0d0f12,0 0 0 9px #3a414a"></canvas>
       <div data-px="MEET YOUR GAUGIE" data-s="3" style="margin-bottom:8px"></div><p>Your car pet lives on the dashboard gauge. This phone is its hub: care remote, data sources, backdrops.</p>
       <div class="row" style="justify-content:center"><button class="btn" id="obpair" ${navigator.bluetooth ? '' : 'disabled'}>PAIR GAUGIE</button><button class="btn org" id="obdemo">TRY DEMO</button></div>
       ${navigator.bluetooth ? '' : '<p class="mut">This browser has no Web Bluetooth (iOS Safari). Use demo mode here, or the iOS app build (Capacitor).</p>'}`,
      `<div data-px="SCANNING..." data-s="3"></div><p>Tap the Gaugie screen to wake it, then pick "Gaugie ..." in the list.</p><p class="mut" id="obe"></p><button class="btn ghost" id="obback">BACK</button>`,
      `<div data-px="NAME YOUR CAR" data-s="3" style="margin-bottom:8px"></div><p>Up to 12 letters. Shown on the device and to friend Gaugies.</p>
       <input type="text" id="obn" maxlength="12" value="${esc(st ? st.n : 'BLIPPY')}" style="text-align:center;font-size:18px;text-transform:uppercase">
       <p><button class="btn" id="obgo">START</button></p>`][step]}</div>`;
    pxify(o);
    const c = o.querySelector('#obm'); if (c) core().then(k => { k.nw(now(), 5); k.set(80, 90, 90, 100, 80, 3000, 1, 0, 0, 0, 0, 1); k.ui(0, 0, 0, 4, 3000); blit(k, k.draw(3000), c); });
    const b = id => o.querySelector('#' + id);
    if (b('obdemo')) b('obdemo').onclick = async () => { await connect('demo'); step = 2; show(); };
    if (b('obpair')) b('obpair').onclick = async () => { step = 1; show(); try { await connect('ble'); step = 2; show(); } catch (e) { if (b('obe')) b('obe').textContent = e.message; } };
    if (b('obback')) b('obback').onclick = () => { step = 0; show(); };
    if (b('obgo')) b('obgo').onclick = async () => { await dev.send({ t: 'name', v: b('obn').value }); S.onboarded = true; save(); o.hidden = true; log('name', 'Hello ' + (st ? st.n : '') + '!'); render(); };
  };
  show();
}

const CODES = GaugieCodes({ onSpeed: v => onSpeed(v), core, dev: () => dev, S, save, log, toast, render: () => render(), go, esc });

// ---------- boot ----------
$('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-tab="${k}"><span data-px="${n}" data-c="lgt"></span></button>`).join(''); pxify($('#tabs'));
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !MOCK) navigator.serviceWorker.register('sw.js').catch(() => {});
(function loop(t) { const m = $('#mir') || $('#pcv'); if (m && dev) dev.frame(t, m); requestAnimationFrame(loop); })(0);
if (MOCK) { window.gaugieHub = { get cfg() { return cfg; }, chip, odoPush, CODES, key, S, connect, render, go, onboarding, care, fire, simFriend, get dev() { return dev; }, get st() { return st; } }; return; }
// Web Bluetooth can't reconnect without a user tap, so returning users start in demo until they tap Pair (Settings).
if (!S.onboarded) onboarding(); else { await connect('demo'); render(); geo(); odoGps(); }
if (Q.get('music') != null && dev) { S.music = Q.get('music') === '1'; save(); dev.send({ t: 'music', on: S.music ? 1 : 0 }); }
if (Q.get('ev') && S.onboarded) { await fire(Q.get('ev'), Q.get('k') || 'ping', +(Q.get('v') || 0), 'url'); history.replaceState(null, '', location.pathname); }
})();
